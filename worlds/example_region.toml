# Пример региона: 3 города и привязанные деревни (REQUIREMENTS §11, шаг 2).
# Числа — стартовые для калибровки, не решения. Деревни производят еду,
# города — ремесло и роскошь; торговля выравнивает цены через арбитраж.
#
# base_price (P0_g) взяты из прайс-листа D&D (gp) — см. references/gear.csv,
# сгенерированный scripts/extract_gear.py. Модель относительна к этому списку (§2),
# поэтому абсолютный масштаб не важен, но реальные соотношения дают честную проверку.

seed = 42

# --- Товары -------------------------------------------------------------------
# Корзина еды: grain + fish, веса в сумме 1 (§5.8). Рынок: cloth + tools + wine.

[goods.grain]
category = "food"
price_class = "necessity"
base_price = 0.01        # Пшеница, 0.01 gp
per_capita = 1.0
in_food_basket = true
basket_weight = 0.6

[goods.fish]
category = "food"
price_class = "necessity"
base_price = 0.1         # нет товарной позиции в PHB; proxy ~ сыр/кусок 0.1 gp
per_capita = 0.5
in_food_basket = true
basket_weight = 0.4
spoilage = 0.03          # рыба портится быстрее (переопределение §7)

[goods.cloth]
category = "cloth"
price_class = "common"
base_price = 0.5         # Ткань хлопчатобумажная, 0.5 gp
per_capita = 0.10
basket_weight = 0.4

[goods.tools]
category = "weapons"
price_class = "common"
base_price = 5.0         # инструменты ремесленника, порядок 5 gp
per_capita = 0.05
basket_weight = 0.3

[goods.wine]
category = "luxury"
price_class = "luxury"
base_price = 10.0        # Вино изысканное (бутылка), 10 gp
per_capita = 0.03
basket_weight = 0.3

# --- Города -------------------------------------------------------------------

[nodes.redwater]
kind = "city"
population = 1200
prosperity0 = 0.5
capacity = { cloth = 180.0, tools = 90.0, wine = 50.0, grain = 200.0 }

[nodes.stonehaven]
kind = "city"
population = 1000
prosperity0 = 0.5
capacity = { tools = 160.0, cloth = 60.0, grain = 150.0 }

[nodes.greenvale]
kind = "city"
population = 900
prosperity0 = 0.5
capacity = { wine = 120.0, cloth = 80.0, grain = 150.0 }

# --- Деревни (производители еды, привязаны к городам) -------------------------

[nodes.millbrook]
kind = "village"
population = 320
hub = "redwater"
capacity = { grain = 1100.0 }

[nodes.eastford]
kind = "village"
population = 280
hub = "redwater"
capacity = { grain = 600.0, fish = 900.0 }

[nodes.greyrock]
kind = "village"
population = 300
hub = "stonehaven"
capacity = { grain = 1200.0 }

[nodes.lakeside]
kind = "village"
population = 260
hub = "greenvale"
capacity = { grain = 500.0, fish = 1100.0 }

# --- Дороги (каждая раскрывается в две дуги) ----------------------------------

[[roads]]
a = "redwater"
b = "millbrook"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "redwater"
b = "eastford"
travel_time = 2
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "stonehaven"
b = "greyrock"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "greenvale"
b = "lakeside"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "redwater"
b = "stonehaven"
travel_time = 3
difficulty = 1.2
capacity = 400.0

[[roads]]
a = "stonehaven"
b = "greenvale"
travel_time = 4
difficulty = 1.3
capacity = 400.0

[[roads]]
a = "redwater"
b = "greenvale"
travel_time = 4
difficulty = 1.1
capacity = 400.0
