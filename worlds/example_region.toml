# Example region: 3 cities, 6 villages and a trading post (REQUIREMENTS §11, step 2; M8).
# Numbers are calibration values, not decisions. Villages produce food and raw materials,
# cities produce crafts and luxury, the eastern trading post brings spices and silk; trade
# evens out prices through arbitrage (§5.6). No production chains (v1.1, D3): iron does not
# turn into weapons.
#
# base_price (P0_g) comes from the SRD 5.1 price list (gp) — see references/srd_gear.csv,
# generated by scripts/build_srd_gear.py (D5). The model is relative to this list (§2),
# so the absolute scale does not matter, but real ratios make for an honest check.
#
# Calibration notes (tests/test_example_world.py checks them after warm-up, §5.14):
# - per_capita is in trade units per person per day, scaled so that flows fit the road
#   capacities; production capacity is a multiple of the region-wide demand (more for
#   goods that spoil or travel far).
# - Food, materials and crafts keep deeper stocks than the §7 defaults (coverage_days):
#   a hub city can only re-export above its reserve ρ_res·s* (§5.6), so without deeper
#   stocks the villages of a region that does not make a good stay pinned at m_max.
# - Exporting villages send most of their output to their hub (hub_share 0.9, §5.6); with
#   the default 0.6 the remainder piles up in a small village and its price sits at m_min.
# - Weapons keep 60 days of stock (M9, R30): plate armour (1500 gp = 100 longsword units)
#   must fit into every city's weapons stock after warm-up (shop "too big" rule, D8).
# - Luxury goods keep 30 days instead of the §7 default 14 (R30): the priciest luxury items
#   (spyglass 1000 gp = 500 spice units) stay buyable in every city, and luxury prices calm down.
#   Wine and spices tie on total capacity (125), so generic luxury shop items resolve to spices
#   by id; a capacity change can move them to wine (base 10 gp vs 2 gp).

seed = 42

# --- Goods --------------------------------------------------------------------
# Food basket: grain, fish, meat, salt; weights sum to 1 (§5.8). Market: the rest.

[goods.grain]
name = { en = "Grain", ru = "Зерно" }
category = "food"
price_class = "necessity"
base_price = 0.01        # SRD wheat-1-lb, 1 cp
per_capita = 0.1
in_food_basket = true
basket_weight = 0.5
coverage_days = 30.0

[goods.fish]
name = { en = "Fish", ru = "Рыба" }
