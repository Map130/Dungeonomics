# Example region: 3 cities with their villages (REQUIREMENTS §11, step 2).
# Numbers are calibration starting points, not decisions. Villages produce food,
# cities produce crafts and luxury; trade evens out prices through arbitrage.
#
# base_price (P0_g) comes from the SRD 5.1 price list (gp) — see references/srd_gear.csv,
# generated by scripts/build_srd_gear.py (D5). The model is relative to this list (§2),
# so the absolute scale does not matter, but real ratios make for an honest check.

seed = 42

# --- Goods --------------------------------------------------------------------
# Food basket: grain + fish, weights sum to 1 (§5.8). Market: cloth + tools + wine.

[goods.grain]
category = "food"
price_class = "necessity"
base_price = 0.01        # SRD wheat-1-lb, 1 cp
per_capita = 1.0
in_food_basket = true
basket_weight = 0.6

[goods.fish]
category = "food"
price_class = "necessity"
base_price = 0.1         # no fish in the SRD; proxy: cheese-hunk, 1 sp
per_capita = 0.5
in_food_basket = true
basket_weight = 0.4
spoilage = 0.03          # fish spoils faster (overrides §7)

[goods.cloth]
category = "cloth"
price_class = "common"
base_price = 0.5         # SRD cotton-cloth-1-sq-yd, 5 sp
per_capita = 0.10
basket_weight = 0.4

[goods.tools]
category = "weapons"
price_class = "common"
base_price = 5.0         # SRD leatherworkers-tools / cobblers-tools, 5 gp
per_capita = 0.05
basket_weight = 0.3

[goods.wine]
category = "luxury"
price_class = "luxury"
base_price = 10.0        # SRD wine-fine-bottle, 10 gp
per_capita = 0.03
basket_weight = 0.3

# --- Cities -------------------------------------------------------------------

[nodes.redwater]
kind = "city"
population = 1200
prosperity0 = 0.5
capacity = { cloth = 180.0, tools = 90.0, wine = 50.0, grain = 200.0 }

[nodes.stonehaven]
kind = "city"
population = 1000
prosperity0 = 0.5
capacity = { tools = 160.0, cloth = 60.0, grain = 150.0 }

[nodes.greenvale]
kind = "city"
population = 900
prosperity0 = 0.5
capacity = { wine = 120.0, cloth = 80.0, grain = 150.0 }

# --- Villages (food producers, bound to a hub city) ---------------------------

[nodes.millbrook]
kind = "village"
population = 320
hub = "redwater"
capacity = { grain = 1100.0 }

[nodes.eastford]
kind = "village"
population = 280
hub = "redwater"
capacity = { grain = 600.0, fish = 900.0 }

[nodes.greyrock]
kind = "village"
population = 300
hub = "stonehaven"
capacity = { grain = 1200.0 }

[nodes.lakeside]
kind = "village"
population = 260
hub = "greenvale"
capacity = { grain = 500.0, fish = 1100.0 }

# --- Roads (each expands into two arcs) ---------------------------------------

[[roads]]
a = "redwater"
b = "millbrook"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "redwater"
b = "eastford"
travel_time = 2
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "stonehaven"
b = "greyrock"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "greenvale"
b = "lakeside"
travel_time = 1
difficulty = 1.0
capacity = 600.0

[[roads]]
a = "redwater"
b = "stonehaven"
travel_time = 3
difficulty = 1.2
capacity = 400.0

[[roads]]
a = "stonehaven"
b = "greenvale"
travel_time = 4
difficulty = 1.3
capacity = 400.0

[[roads]]
a = "redwater"
b = "greenvale"
travel_time = 4
difficulty = 1.1
capacity = 400.0
