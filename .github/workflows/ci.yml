name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bench-build:
    name: Benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Бенчи не гоняем в CI (шумно), только проверяем компиляцию.
      - run: cargo build --workspace --benches

  wasm:
    name: WASM build-check (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Ядро обязано быть WASM-совместимо (цель §7: компиляция в WASM).
      - run: cargo build -p ddeco-core --target wasm32-unknown-unknown
      # Биндинги для UI собираются в тот же target.
      - run: cargo build -p ddeco-wasm --target wasm32-unknown-unknown

  wasm-pack:
    name: WASM pack + node smoke + UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Упаковка под Node и smoke-тест формы JSON (слой serde-wasm-bindgen,
      # который host-тесты фасада проверить не могут).
      - run: wasm-pack build crates/ddeco-wasm --target nodejs --out-dir pkg-node
      - run: node crates/ddeco-wasm/smoke/smoke.cjs
      # Веб-UI: собрать пакет под браузер и прогнать type-check + vite build.
      - run: wasm-pack build crates/ddeco-wasm --target web --out-dir ../../web/src/pkg
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  python:
    name: Python reference (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
