name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bench-build:
    name: Benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Benches are not run in CI (noisy), we only check that they compile.
      - run: cargo build --workspace --benches

  wasm:
    name: WASM build-check (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The core must be WASM-compatible (goal §7: compiles to WASM).
      - run: cargo build -p ddeco-core --target wasm32-unknown-unknown
      # The UI bindings are built for the same target.
      - run: cargo build -p ddeco-wasm --target wasm32-unknown-unknown

  wasm-pack:
    name: WASM pack + node smoke + UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Package for Node and smoke-test the JSON shape (the serde-wasm-bindgen layer,
      # which the facade's host tests cannot check).
      - run: wasm-pack build crates/ddeco-wasm --target nodejs --out-dir pkg-node
      - run: node crates/ddeco-wasm/smoke/smoke.cjs
      # Web UI: build the browser package and run type-check + vite build.
      - run: wasm-pack build crates/ddeco-wasm --target web --out-dir ../../web/src/pkg
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  python:
    name: Python reference (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
