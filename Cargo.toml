[workspace]
resolver = "2"
members = ["crates/ddeco-core", "crates/ddeco-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake2 = "0.10"
libm = "0.2"
criterion = "0.5"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
# Determinism matters more than micro-optimisations: no aggressive fast-math (rustc has none anyway),
# the fixed order of operations is preserved.
lto = true
