[workspace]
resolver = "2"
members = ["crates/ddeco-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake2 = "0.10"
libm = "0.2"
criterion = "0.5"

[profile.release]
# Детерминизм важнее микрооптимизаций: без agressive fast-math (его в rustc и нет),
# фиксированный порядок операций сохраняется.
lto = true
