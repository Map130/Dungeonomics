[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddeco"
version = "0.1.0"
description = "Живая экономика для настольных RPG: Python-прототип ядра симуляции"
readme = "README.md"
requires-python = ">=3.11"
# Ядро намеренно без runtime-зависимостей (stdlib only): детерминизм требует
# явного порядка суммирования, и чистый Python прямо мапится на будущий порт в Rust.
dependencies = []

[project.optional-dependencies]
# Инструменты разработки и notebook-калибровки. Ядро их не импортирует.
dev = ["pytest>=8", "numpy>=1.26", "matplotlib>=3.8", "jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["ddeco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
